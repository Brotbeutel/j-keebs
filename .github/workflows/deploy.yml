name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) { console.log(name + ': ' + v.severity + ' | direct=' + v.isDirect + ' | range=' + v.range + ' | fixAvailable=' + JSON.stringify(v.fixAvailable)); for (const item of v.via || []) if (typeof item === 'object') console.log('  advisory:', item.title, '| url=' + item.url, '| range=' + item.range); } console.log('Totals:', JSON.stringify(a.metadata?.vulnerabilities || {}));"

      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Build with Eleventy
        run: npm run build

      - name: Check built links
        run: python scripts/check_links.py _site

      - name: Check HTML tag balance
        run: python scripts/tag_balance.py _site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5